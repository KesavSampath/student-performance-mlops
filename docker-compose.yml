# ── docker-compose.yml ────────────────────────────────────────────────────────
# Student Performance MLOps — IT4V43
#
# Services:
#   backend  → FastAPI (port 8000)
#   frontend → Streamlit (port 8501)
#   mlflow   → MLflow Tracking Server (port 5000)
#
# Usage:
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: mlops-mlflow
    working_dir: /mlflow
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install mlflow==3.14.0 --quiet &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/mlartifacts"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./mlflow.db:/app/mlflow.db
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Streamlit Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: mlops-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
