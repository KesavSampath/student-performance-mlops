name: MLOps CI/CD Pipeline — IT4V43

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Test, train, and quality gate
  # ──────────────────────────────────────────────────────────────────────────
  mlops-pipeline:
    name: MLOps Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Generate synthetic dataset ─────────────────────────────────────
      - name: Generate dataset
        run: python src/generate_data.py

      # ── 5. Validate data ───────────────────────────────────────────────────
      - name: Validate data (Pandera)
        run: python src/data_validation.py

      # ── 6. Run unit tests (pre-training) ──────────────────────────────────
      - name: Run unit tests (pre-train)
        run: |
          pytest tests/test_data_validation.py tests/test_preprocessing.py \
                 -v --tb=short

      # ── 7. Train models ────────────────────────────────────────────────────
      - name: Train models (MLflow)
        run: python src/train.py

      # ── 8. Run all tests (post-training, includes model + API tests) ───────
      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=api \
                 --cov-report=term-missing

      # ── 9. Model quality gate ──────────────────────────────────────────────
      - name: Model quality gate
        run: |
          python -c "
          import json
          from src.evaluate import quality_gate

          with open('models/model_metadata.json') as f:
              meta = json.load(f)

          print(f'Model: {meta[\"model_name\"]}')
          print(f'Metrics: {meta[\"metrics\"]}')
          quality_gate(meta['metrics'], raise_on_fail=True)
          print('Quality gate PASSED')
          "

      # ── 10. Generate SHAP explanations ─────────────────────────────────────
      - name: Generate SHAP explanations
        run: python src/explain.py

      # ── 11. Upload MLflow database ────────────────────────────────────────────
      - name: Upload MLflow database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-database
          path: mlflow.db
          retention-days: 7

      # ── 12. Upload model artifacts ─────────────────────────────────────────
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/best_model.joblib
            models/preprocessor.joblib
            models/model_metadata.json
            models/shap_summary.png
            models/shap_bar.png
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build Docker images (runs after pipeline passes)
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: mlops-pipeline
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: student-performance-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.streamlit
          push: false
          tags: student-performance-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build summary
        run: |
          echo "✓ Backend image built: student-performance-backend:latest"
          echo "✓ Frontend image built: student-performance-frontend:latest"
          echo "Local deployment: docker compose up --build"
